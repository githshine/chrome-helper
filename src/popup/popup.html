<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../lib/common.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>Word Cloud Analyzer</title>
  </head>
  <body>
    <div class="page">
      <div class="row">
        <strong>Word Cloud Analyzer</strong>
        <span class="spacer"></span>
        <span id="sessionState" class="pill">idle</span>
      </div>

      <div class="panel" id="tabPanel">
        <div class="row">
          <span id="tabHost" class="mono">—</span>
        </div>
        <div class="row" style="margin-top: 8px">
          <button id="toggleBtn" class="primary">Start capturing</button>
          <button id="dashboardBtn">Dashboard</button>
        </div>
        <p id="error" class="muted" hidden></p>
      </div>

      <div class="panel">
        <div class="row wrap">
          <label><input type="checkbox" id="autoRefresh" /> Auto-refresh every</label>
          <input type="number" id="refreshInterval" min="0.5" step="0.5" style="width: 64px" />
          <span class="muted">min</span>
        </div>
        <div class="row" style="margin-top: 6px">
          <span class="muted">Next refresh:</span>
          <span id="nextRefresh" class="mono">—</span>
        </div>
      </div>

      <div class="panel">
        <div class="grid">
          <div><span class="muted">This session</span><div id="sessionAdded" class="mono big">0</div></div>
          <div><span class="muted">Cycles</span><div id="sessionCycles" class="mono big">0</div></div>
          <div><span class="muted">Stored blocks</span><div id="totalDocs" class="mono big">0</div></div>
        </div>
        <div class="row" style="margin-top: 6px">
          <span id="lastStats" class="muted"></span>
        </div>
        <div class="row wrap" style="margin-top: 6px">
          <span id="longWords" class="muted" hidden></span>
        </div>
      </div>

      <div class="row wrap">
        <button data-window="30m">Cloud · last 30 min</button>
        <button data-window="24h">24 h</button>
        <button data-window="7d">7 days</button>
        <span class="spacer"></span>
        <button id="optionsBtn">Settings</button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
